# RoboClaw Default Configuration
# Values here can be overridden by environment-specific configs

robot:
  model: "h1_unitree"  # default embodiment
  urdf_path: ""

infrastructure:
  postgres:
    host: "localhost"
    port: 5432
    database: "roboclaw"
    user: "roboclaw"
    password: "roboclaw_dev"
    pool_min_size: 5
    pool_max_size: 20

  redis:
    host: "localhost"
    port: 6379
    db: 0
    password: ""
    socket_timeout: 5.0

  milvus:
    host: "localhost"
    port: 19530
    db_name: "roboclaw"
    collections:
      episode_embeddings:
        name: "episode_embeddings"
        dim: 1536
        index_type: "IVF_FLAT"
        metric_type: "COSINE"
      skill_embeddings:
        name: "skill_embeddings"
        dim: 1536
        index_type: "IVF_FLAT"
        metric_type: "COSINE"
      failure_patterns:
        name: "failure_patterns"
        dim: 1536
        index_type: "IVF_FLAT"
        metric_type: "COSINE"

  rabbitmq:
    host: "localhost"
    port: 5672
    user: "roboclaw"
    password: "roboclaw_dev"
    vhost: "/"
    exchanges:
      sensor_events: "roboclaw.sensors"
      task_events: "roboclaw.tasks"
      a2a_events: "roboclaw.a2a"

llm:
  provider: "openai_compatible"  # anthropic | openai | openai_compatible
  api_base: ""                    # OpenAI-compatible API endpoint (empty = use templates)
  api_key: "${OPENAI_API_KEY}"    # API key or env var reference
  model: "gpt-4o"
  temperature: 0.1
  max_tokens: 4096
  planning:
    model: "gpt-4o"
    temperature: 0.1
    max_tokens: 8192

agent:
  loop_rate_hz: 50           # Main loop frequency
  perception_rate_hz: 10     # Sensor processing frequency
  planning_min_interval_s: 1.0  # Minimum time between re-plans
  max_recovery_attempts: 3
  default_timeout_s: 30.0
  safety_check_rate_hz: 100

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]
  rate_limit_per_minute: 60

a2a:
  enabled: true
  discovery_interval_s: 30.0
  task_timeout_s: 300.0

sim:
  enabled: false
  backend: "mujoco"
  model_path: ""
  render: false
  headless: true
  timestep: 0.002
  control_decimation: 5
  sensor_rate_hz: 100

ros2:
  enabled: false
  node_name: "roboclaw_bridge"
  joint_state_topic: "/joint_states"
  imu_topic: "/imu/data"
  joint_command_topic: "/joint_trajectory_controller/joint_trajectory"
  left_ft_topic: "/left_wrist/ft"
  right_ft_topic: "/right_wrist/ft"
  walk_action: "/walk_to_pose"
  grasp_action: "/whole_body_grasp"

logging:
  level: "INFO"
  format: "json"  # json | console
  structlog_processors:
    - "structlog.stdlib.add_log_level"
    - "structlog.processors.TimeStamper(fmt='iso')"
