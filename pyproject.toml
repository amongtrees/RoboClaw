[project]
name = "roboclaw"
version = "0.2.0"
description = "Production-grade vertical agent framework for humanoid robotics"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "RoboClaw Team" }
]
keywords = ["robotics", "humanoid", "agent", "langgraph", "embodied-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "sse-starlette>=2.0.0",

    # Agent orchestration
    "langgraph>=0.3.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",

    # Data validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Database
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",

    # Cache & session
    "redis>=5.0.0",
    "hiredis>=2.3.0",

    # Vector database
    "pymilvus>=2.4.0",

    # Message queue
    "aio-pika>=9.4.0",

    # Utilities
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "tenacity>=8.0.0",
    "structlog>=24.0.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "httpx-ws>=0.6.0",
    "mypy>=1.10",
    "ruff>=0.5.0",
]
ros2 = [
    "rclpy>=5.0.0",
    "geometry-msgs",
    "sensor-msgs",
    "tf2-ros",
    "trajectory-msgs",
    "std-msgs",
]
sim = [
    "mujoco>=3.0.0",
    "dm-control>=1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
